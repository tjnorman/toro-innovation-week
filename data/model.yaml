# Toro Innovation Week: one college, one day.
# Every figure the charts, README, and site use lives in this file.
# Status words: "record" = from a campus or public record; "proposal" = recommended, not decided.
meta:
  title: Toro Innovation Week
  tagline: Five colleges. Five days. One Innovation Incubator.
  author: Thomas J. Norman, Ph.D.
  as_of: "2026-11-24"
  status: Faculty proposal. Not a university decision.

rates:
  wtu_cost: 2488.40          # Academic Affairs rate per WTU, Nov 9, 2026
  hours_per_wtu: 45          # hours per WTU per semester
  weeks_per_semester: 15
  student_wage: 18
  student_hours_week: 60
  student_weeks_year: 32
  supplies: 4263
  base_budget: 105786        # FY 2026-27 base budget, Academic Affairs, Nov 9, 2026
  base_exec_director_line: 42162   # vacant half-time Executive Director line inside the base
  work_hours_semester: 730   # estimated spring 2027 faculty hours for current programs (Oct 23, 2026 estimate)
  director_wtu_today: 6

days:
  - key: mon
    day: Monday
    college: Natural and Behavioral Sciences
    short: CNBS
    color: "#2a78d6"
    color_dark: "#3987e5"
    focus: Games technology, data, and sustainability
    ideas:
      - Student teams map transit, heat, and crowd data for Carson and campus venues
      - Computing and systems students build simple tools for local suppliers
      - Sustainability projects tied to the five Olympic and three Paralympic sports on campus
    group: Toro Guardian Scholars
    partner: Toro Learning & Testing Center
  - key: tue
    day: Tuesday
    college: Health, Human Services, and Nursing
    short: CHHSN
    color: "#eb6834"
    color_dark: "#d95926"
    focus: Health, wellness, and adaptive sport
    ideas:
      - Paralympic sports on campus as a focus for adaptive-sport and accessibility ventures
      - Visitor and community health projects with local clinics and nonprofits
      - Wellness ventures from the SDSU Social Venture Challenge pipeline
    group: Rotaract
    partner: Writing Center
  - key: wed
    day: Wednesday
    college: Arts and Humanities, with Labor Studies
    short: CAH
    color: "#1baf7a"
    color_dark: "#199e70"
    focus: Games jobs, worker voice, culture, and design
    ideas:
      - Labor Studies tracks Games hiring and job quality for South Bay workers
      - Design, media, and language students serve local makers and vendors
      - Cultural programming that tells the story of Carson and Compton
    group: IEEE Computer Society
    partner: First-Year and Transfer Experience
  - key: thu
    day: Thursday
    college: Education
    short: COE
    color: "#eda100"
    color_dark: "#c98500"
    focus: Youth, schools, and volunteer training
    ideas:
      - Games-themed lessons and field projects with local schools
      - Training for student volunteers and community hosts
      - Youth entrepreneurship days with partner programs
    group: Human Resource Management Association (HRMA)
    partner: Writing Center
  - key: fri
    day: Friday
    college: Business Administration and Public Policy
    short: CBAPP
    color: "#e87ba4"
    color_dark: "#d55181"
    focus: Small business supplier readiness
    ideas:
      - RAMP LA registration, county certification, and a capability statement for each business
      - Alpha Start bootcamps for student founders
      - Carson Small Business Academy, if the City approves a new agreement
    group: Latine Business Student Association
    partner: Community Engaged Learning

