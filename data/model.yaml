partners:
  - name: Writing Center
    role: Pitch and proposal hours, twice a week
    goal: 60 students a semester get feedback on a pitch, grant, or capability statement
  - name: First-Year and Transfer Experience
    role: A weekly hour that brings new Toros into the space
    goal: 100 first-year and transfer students attend a college day in their first term
  - name: Toro Learning & Testing Center
    role: Weekly drop-in help with the numbers behind a venture
    goal: 50 tutoring visits a semester on pricing, budgets, and spreadsheets
  - name: Community Engaged Learning
    role: Runs the Catapult studio with each college, every day
    goal: One Catapult course in every college each semester

