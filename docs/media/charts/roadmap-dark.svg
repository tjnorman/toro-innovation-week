<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 442" width="860" height="442" role="img" aria-label="Roadmap from December 2026 to the 2028 Games" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="24.0" y="30.0" font-size="18" fill="#f0f6fc" font-weight="600" text-anchor="start" >From decision to the Games</text><text x="24.0" y="52.0" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="start" >A spring 2027 pilot gives the model three semesters before LA28</text><line x1="170" x2="170" y1="78" y2="374" stroke="#3d444d" stroke-width="2"/><text x="150.0" y="86.5" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="end" >Dec 2026</text><path d="M170 74 l8 8 l-8 8 l-8 -8 z" fill="#e0608c" stroke="#0d1117" stroke-width="2"/><text x="192.0" y="86.5" font-size="13.5" fill="#f0f6fc" font-weight="600" text-anchor="start" >President endorses the direction</text><text x="836.0" y="86.5" font-size="11" fill="#9198a1" font-weight="400" text-anchor="end" >Decision</text><text x="150.0" y="122.5" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="end" >Jan 2027</text><path d="M170 110 l8 8 l-8 8 l-8 -8 z" fill="#e0608c" stroke="#0d1117" stroke-width="2"/><text x="192.0" y="122.5" font-size="13.5" fill="#f0f6fc" font-weight="600" text-anchor="start" >Deans name five faculty leads</text><text x="836.0" y="122.5" font-size="11" fill="#9198a1" font-weight="400" text-anchor="end" >Decision</text><text x="150.0" y="158.5" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="end" >Feb 2027</text><circle cx="170" cy="154" r="6.5" fill="#f0f6fc" stroke="#0d1117" stroke-width="2"/><text x="192.0" y="158.5" font-size="13.5" fill="#f0f6fc" font-weight="400" text-anchor="start" >Spring pilot: five college days begin</text><text x="836.0" y="158.5" font-size="11" fill="#9198a1" font-weight="400" text-anchor="end" >Launch</text><text x="150.0" y="194.5" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="end" >Feb 5, 2027</text><circle cx="170" cy="190" r="6.5" fill="#656c76" stroke="#0d1117" stroke-width="2"/><text x="192.0" y="194.5" font-size="13.5" fill="#f0f6fc" font-weight="400" text-anchor="start" >CPaCE Accelerator proposal due</text><text x="836.0" y="194.5" font-size="11" fill="#9198a1" font-weight="400" text-anchor="end" >Deadline</text><text x="150.0" y="230.5" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="end" >Mar 12, 2027</text><circle cx="170" cy="226" r="6.5" fill="#656c76" stroke="#0d1117" stroke-width="2"/><text x="192.0" y="230.5" font-size="13.5" fill="#f0f6fc" font-weight="400" text-anchor="start" >2027-28 structure memo due</text><text x="836.0" y="230.5" font-size="11" fill="#9198a1" font-weight="400" text-anchor="end" >Deadline</text><text x="150.0" y="266.5" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="end" >Jun 11, 2027</text><circle cx="170" cy="262" r="6.5" fill="#656c76" stroke="#0d1117" stroke-width="2"/><text x="192.0" y="266.5" font-size="13.5" fill="#f0f6fc" font-weight="400" text-anchor="start" >CPaCE final reports and first impact report</text><text x="836.0" y="266.5" font-size="11" fill="#9198a1" font-weight="400" text-anchor="end" >Deadline</text><text x="150.0" y="302.5" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="end" >Aug 2027</text><circle cx="170" cy="298" r="6.5" fill="#f0f6fc" stroke="#0d1117" stroke-width="2"/><text x="192.0" y="302.5" font-size="13.5" fill="#f0f6fc" font-weight="400" text-anchor="start" >Full model, year one</text><text x="836.0" y="302.5" font-size="11" fill="#9198a1" font-weight="400" text-anchor="end" >Launch</text><text x="150.0" y="338.5" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="end" >Jul 14, 2028</text><circle cx="170" cy="334" r="6.5" fill="#e3b341" stroke="#0d1117" stroke-width="2"/><text x="192.0" y="338.5" font-size="13.5" fill="#f0f6fc" font-weight="600" text-anchor="start" >Olympic Games open (