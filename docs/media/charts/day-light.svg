<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="How one college day works: four inputs feed a college day that produces three results" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="24.0" y="30.0" font-size="18" fill="#1f2328" font-weight="600" text-anchor="start" >How one college day works</text><text x="24.0" y="52.0" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" >The same four ingredients, five days a week</text><rect x="24" y="76" width="262" height="48" rx="6" fill="#f6f8fa" stroke="#8c959f"/><text x="38.0" y="96.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="start" >Faculty lead</text><text x="38.0" y="113.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="start" >3 WTU · about 9 hours a week</text><path d="M290 100 C 320 100, 320 190, 348 190" fill="none" stroke="#8c959f" stroke-width="1.5"/><rect x="24" y="136" width="262" height="48" rx="6" fill="#f6f8fa" stroke="#8c959f"/><text x="38.0" y="156.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="start" >Shared student pool</text><text x="38.0" y="173.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="start" >12 student hours for the day</text><path d="M290 160 C 320 160, 320 190, 348 190" fill="none" stroke="#8c959f" stroke-width="1.5"/><rect x="24" y="196" width="262" height="48" rx="6" fill="#f6f8fa" stroke="#8c959f"/><text x="38.0" y="216.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="start" >Catapult studio</text><text x="38.0" y="233.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="start" >Community Engaged Learning + a course</text><path d="M290 220 C 320 220, 320 190, 348 190" fill="none" stroke="#8c959f" stroke-width="1.5"/><rect x="24" y="256" width="262" height="48" rx="6" fill="#f6f8fa" stroke="#8c959f"/><text x="38.0" y="276.0" font-size="13" fill="#1f2328" font-weight