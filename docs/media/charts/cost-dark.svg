<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 272" width="860" height="272" role="img" aria-label="What each option costs a year" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="24.0" y="30.0" font-size="18" fill="#f0f6fc" font-weight="600" text-anchor="start" >What each option costs a year</text><text x="24.0" y="52.0" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="start" >Faculty time, the shared student pool, and supplies</text><text x="286.0" y="97.5" font-size="13" fill="#f0f6fc" font-weight="400" text-anchor="end" >FY 2026–27 base budget</text><path d="M300 78 h321.6 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-321.6 z" fill="#656c76"/><text x="286.0" y="147.5" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="end" >Option B: five college leads</text><path d="M300 128 h345.3 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-345.3 z" fill="#e0608c"/><text x="286.0" y="197.5" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="end" >Option A: five leads + Faculty Director</text><path d="M300 178 h437.2 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-437.2 z" fill="#e0608c"/><line x1="300" x2="300" y1="72" y2="214" stroke="#656c76" stroke-width="1"/><text x="633.6" y="97.5" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#0d1117" stroke-width="5" stroke-linejoin="round">$105,786</text><text x="657.3" y="147.5" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#0d1117" stroke-width="5" stroke-linejoin="round">$113,475</text><text x="749.2" y="197.5" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#0d1117" stroke-width="5" stroke-linejoin="round">$143,336</text><text x="24.0" y="258.0" font-size="11.5" fill="#9198a1" font-weight="400" text-anchor="start" >Option B is $7,689 above the base budget; Option A is $37,550 above. Rate: $2,488.40 per WTU.</text></svg>