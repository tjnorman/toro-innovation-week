<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 272" width="860" height="272" role="img" aria-label="Faculty hours a semester" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="24.0" y="30.0" font-size="18" fill="#f0f6fc" font-weight="600" text-anchor="start" >Faculty hours a semester</text><text x="24.0" y="52.0" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="start" >Hours funded, at 45 hours per WTU</text><text x="286.0" y="97.5" font-size="13" fill="#f0f6fc" font-weight="400" text-anchor="end" >Today: one director, 6 WTU</text><path d="M300 78 h122.1 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-122.1 z" fill="#656c76"/><text x="286.0" y="147.5" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="end" >Option B: five leads, 15 WTU</text><path d="M300 128 h311.1 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-311.1 z" fill="#e0608c"/><text x="286.0" y="197.5" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="end" >Option A: leads + Director, 21 WTU</text><path d="M300 178 h437.2 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-437.2 z" fill="#e0608c"/><line x1="640.8" x2="640.8" y1="70" y2="214" stroke="#e3b341" stroke-width="2" stroke-dasharray="5 4"/><text x="640.8" y="65.0" font-size="11.5" fill="#f0f6fc" font-weight="600" text-anchor="middle" >730 hours of program work</text><line x1="300" x2="300" y1="72" y2="214" stroke="#656c76" stroke-width="1"/><text x="434.1" y="97.5" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#0d1117" stroke-width="5" stroke-linejoin="round">270 hours</text><text x="623.1" y="147.5" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#0d1117" stroke-width="5" stroke-linejoin="round">675 hours</text><text x="749.2" y="197.5" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#0d1117" stroke-width="5" stroke-linejoin="round">945 hours</text><text x="24.0" y="258.0" font-size="11.5" fill="#9198a1" font-weight="400" text-anchor="start" >The dashed line is the October 2026 estimate of faculty hours the current programs need each semester.</text></svg>